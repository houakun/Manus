# ruff 基线（lab 与 api 共用一套写法）
#
# == 为什么需要这个文件 ==
# ruff 的"现代化"规则（UP006/UP007/UP035/UP045 等）会把仓库里的
# `typing.List` / `typing.Dict` / `Optional[X]` 全部报成问题 —— 实测 **783 条**。
# 而这一套写法是**刻意的**：它与 `api/`（被测对象）保持一致的风格，
# 批量改写 700+ 行注解对"测量台"的功能零收益，却会把真正的改动埋进噪声里
# （用户要逐行审阅 diff）。
#
# 所以这里显式关掉"注解风格现代化"这一类，**只保留 F/E 类**（未用导入、
# 未定义名、语法问题……）—— 那些才是会真的出问题的。
# 统计（2026-09-20，关闭前后）：
#   `ruff check lab/ --select UP`  → 783 条（全是风格）
#   `ruff check lab/ --select E4,E7,E9,F` → 19 条（13 未用导入 / 3 未用变量 / 1 f-string / 1 重定义）

# == 为什么必须**显式**写 `select`（2026-09-21 补）==
# 上面那句"保留默认的 F/E 类"已经**不再成立**：ruff 0.16.8 的默认规则集实测是
# "接近全量稳定规则"——同一份代码 `ruff check lab/` 报 **47 条**（BLE001/RUF013/
# DTZ005/S110/PLW1510…），而这些规则原本一条都不在默认里；
# 反过来 `E402`（模块级 import 不在顶部）**默认不再报**。
# 也就是说：不写 `select` 时，门禁的实际口径取决于装的 ruff 是哪个版本，
# 与本文档写的口径**相反**。显式写死，漂移就消失了。
#
# 现状（2026-09-21）：`ruff check lab/` = **0 条**（含修完 109 处被删 noqa 对应的刻意忽略）。

target-version = "py312"
line-length = 120

[lint]
# 显式钉住规则集 = ruff 的传统默认，也是本文档上面那行统计的口径
select = ["E4", "E7", "E9", "F"]

# 只关掉"注解/声明风格"这一类
ignore = [
    "UP006",  # List[str] → list[str]
    "UP007",  # Optional[X] → X | None
    "UP035",  # typing.List 已弃用
    "UP037",  # 注解里的引号
    "UP045",  # Optional 已弃用
    "UP009",  # py3 不需要 coding 声明
    "E501",   # 行长：中文注释多，由人控制
    "S608",   # 已复核的误报：lab 的 SQL 全部走参数化（`?` / `:name`）；
              #   唯一"拼"的是 `save_run` 里从**内部固定 dict** 生成列名的 INSERT，
              #   值仍然全部交给占位符。为迁就启发式去改写入路径不值得。
]

[lint.per-file-ignores]
# 这里**刻意不写** `"lab/bench/tasks/**" = ["ALL"]`：
# ruff 只 lint `.py` / `.pyi`，任务 YAML 天然不参与，所以那条 ignore 对 YAML 是**空操作**；
# 它**唯一**的实际效果是连带忽略了 `lab/bench/tasks/ci/_capture_logs.py`
# （897 行的 fixture 生成器）—— 一个真代码文件，本来就该被 lint。
# 删掉之后那里暴露出的 2 条 F541（f-string 无占位符）已修。

# E402：lab 里所有模块级 import 都必须排在 `ensure_sut_on_path()` **之后**
# （`app.*` 在运行期才被加进 sys.path），所以 E402 是**刻意的**，实测 113 处。
#
# 为什么用 per-file-ignores 而不是逐行 `# noqa: E402`：
# noqa 注释**曾经被删过一次** —— 一次过宽的 `ruff check --fix` 移除了 109 处
# `# noqa: E402`（只补回 8 处），而当时 CI 不跑 lint，所以没人发现
# （见 lab/README.md「我错在哪 #11」）。把"刻意忽略"写在**配置**里，
# `--fix` 就再也删不掉它了。
"lab/**" = ["E402"]
