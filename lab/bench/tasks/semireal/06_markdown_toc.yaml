key: sem_markdown_toc
group: semireal
title: 为 Markdown 生成目录
goal: >-
  读取 /home/ubuntu/input/README.md，把其中所有以 "#" 开头的标题
  （包括二三级标题）按出现顺序提取出来，生成一个 Markdown 目录写入
  /home/ubuntu/TOC.md。格式要求：每个标题一行，行首用 "- "，
  保留原有层级缩进（二级标题缩进 2 个空格，三级标题缩进 4 个空格），
  并把标题文字原样保留。
tags: [markdown, text]
fixtures:
  - path: /home/ubuntu/input/README.md
    content: |
      # 项目说明
      这是一段正文。
      ## 安装
      安装步骤。
      ### 依赖
      依赖列表。
      ## 使用
      使用方法。
verify:
  - kind: file_content
    path: /home/ubuntu/TOC.md
    normalize: strip
    equals: |
      - 项目说明
        - 安装
          - 依赖
        - 使用
    description: 生成的目录
process:
  max_tool_calls: 15
solution:
  - kind: write_file
    path: /home/ubuntu/_solve.py
    content: |
      import pathlib

      out = []
      for line in pathlib.Path("input/README.md").read_text().splitlines():
          text = line.rstrip()
          if not text.startswith("#"):
              continue
          level = len(text) - len(text.lstrip("#"))
          if level > 3:
              continue
          out.append(" " * (2 * (level - 1)) + "- " + text[level:].strip())
      pathlib.Path("TOC.md").write_text(chr(10).join(out) + chr(10))
  - kind: exec
    command: "python _solve.py"
wrong:
  - kind: write_file
    path: /home/ubuntu/TOC.md
    content: |
      - 项目说明
      - 安装
      - 依赖
      - 使用
notes: >-
  错误解丢掉了层级缩进 —— 判定器要求缩进完全一致，这是"格式即语义"的任务。

  本任务的目标描述经过一次修正（真实评测发现的问题）：
  原版写的是"所有以 # 开头的标题（包括二三级标题）"，
  结果有一次运行只提取了二三级标题、跳过了 H1，被判失败。
  复盘后认定这是**任务描述歧义**而不是 Agent 的能力问题：
  "包括二三级标题"容易被读成"要提取的是二三级标题"，
  而且当时的缩进规则也只规定了二三级（没提一级），进一步强化了错误读法。
  所以改成显式列举"一级二级三级都要 + 一级缩进 0 个空格"。
  这类假阳性（把任务缺陷当成能力缺陷）正是"任务集也要被验证"要防的东西。
