key: syn_fizzbuzz
group: synthetic
title: FizzBuzz 序列落盘
goal: >-
  生成 1 到 30 的 FizzBuzz 序列并写入 /home/ubuntu/fizzbuzz.txt。
  每行一个，规则：能被 3 整除输出 Fizz，能被 5 整除输出 Buzz，
  同时被 3 和 5 整除输出 FizzBuzz，其余输出数字本身。
tags: [text, file-io]
verify:
  - kind: file_content
    path: /home/ubuntu/fizzbuzz.txt
    normalize: sorted_lines
    equals: |
      1
      2
      Fizz
      4
      Buzz
      Fizz
      7
      8
      Fizz
      Buzz
      11
      Fizz
      13
      14
      FizzBuzz
      16
      17
      Fizz
      19
      Buzz
      Fizz
      22
      23
      Fizz
      Buzz
      26
      Fizz
      28
      29
      FizzBuzz
    description: FizzBuzz 30 项
process:
  max_tool_calls: 15
solution:
  - kind: write_file
    path: /home/ubuntu/fizzbuzz.txt
    content: |
      1
      2
      Fizz
      4
      Buzz
      Fizz
      7
      8
      Fizz
      Buzz
      11
      Fizz
      13
      14
      FizzBuzz
      16
      17
      Fizz
      19
      Buzz
      Fizz
      22
      23
      Fizz
      Buzz
      26
      Fizz
      28
      29
      FizzBuzz
wrong:
  - kind: write_file
    path: /home/ubuntu/fizzbuzz.txt
    content: |
      1
      2
      Fizz
      4
      Buzz
      Fizz
      7
      8
      Fizz
      Buzz
      11
      Fizz
      13
      14
      FizzBuzz
      16
      17
      Fizz
      19
      Buzz
      Fizz
      22
      23
      Fizz
      Buzz
      26
      Fizz
      28
      29
      Fizz
notes: 用 sorted_lines 归一化，避免"行序不同就被判失败"。
