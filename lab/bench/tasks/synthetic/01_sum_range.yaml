key: syn_sum_range
group: synthetic
# regression：traces.db 干净运行 16/16 全对（截至 2026-09-18）→ 稳定，可进回归门禁。
purpose: regression
title: 区间求和写入文件
goal: >-
  计算 1 到 1000 之间所有整数的和，把结果写入 /home/ubuntu/sum.txt。
  文件中只能有这一个数字，不要写单位、说明文字或标题。
tags: [numeric, file-io]
verify:
  - kind: numeric
    path: /home/ubuntu/sum.txt
    value: 500500
    description: 求和结果
process:
  max_tool_calls: 12
  answer_literals: ["500500"]
solution:
  # 参考解**真的算一遍**（而不是把 500500 写出来）：
  # 这样"期望值写错"时参考解就对不上，三步自检会失败 —— 自检才真正有意义。
  # （历史事故：syn_string_reverse / syn_word_freq 的期望值就是错的，
  #   而当时的参考解直接把期望值写出来，所以自检 20/20 全过却掩盖了错误。）
  - kind: write_file
    path: /home/ubuntu/_solve.py
    content: |
      import pathlib
      total = sum(range(1, 1001))
      pathlib.Path("sum.txt").write_text(str(total))
  - kind: exec
    command: "python _solve.py"
wrong:
  - kind: write_file
    path: /home/ubuntu/sum.txt
    content: "500499"
notes: 最基础的任务，用来确认链路通畅；硬编码字面量检测也在这里验证。
