key: syn_date_diff
group: synthetic
# capability（**不是** regression）：干净运行 14/15。唯一一次失败在 2026-09-18 12:49 ——
# 它在噪声地板 suite（eabae098）里，两臂**配置完全相同**、另一臂对了，而它算出 **-76**。
# 题目明写「用后一个日期减去前一个日期」（期望 +76）→ 这不是规格歧义，是真实的符号错误。
# 同一次还响了 `too_many_tool_calls:13>12` 与 `writes_outside_workspace:1`。
# 判定依据：**它在同配置对照里翻转过** → 它自带成功率噪声，不能进回归门禁。
purpose: capability
title: 计算两个日期相差天数
goal: >-
  计算 2025-12-15 与 2026-03-01 之间相差多少天（用较晚的日期减去较早的日期，
  结果为正数），把天数写入 /home/ubuntu/days.txt。
# [2026-10-09 地基修复] 去掉符号歧义：原版写「用后一个日期减去前一个日期」，
# 而两个日期是按“晩→早”的顺序给出的 —— “后一个”按**位置**读是 2025-12-15（得 -76），
# 按**时间**读是 2026-03-01（得 +76，即 verify 的期望值）。两种读法都说得通 = 文本歧义。
# 注意：本文件上面的注释结论（“题目明写…这不是规格歧义，是真实的符号错误”）**保留不改** ——
# 本次只消除文本歧义，不声称它能解释那次失败（同一次还响了 too_many_tool_calls 等 flag）。
# ⚠️ 该任务的历史运行是在**旧 goal** 下产生的 → 对本任务**已作废**（新校准样本里剔除）。
tags: [numeric, date]
verify:
  - kind: numeric
    path: /home/ubuntu/days.txt
    value: 76
    description: 两个日期相差天数
process:
  max_tool_calls: 12
  answer_literals: ["76"]
solution:
  - kind: write_file
    path: /home/ubuntu/_solve.py
    content: |
      import datetime
      import pathlib
      delta = datetime.date(2026, 3, 1) - datetime.date(2025, 12, 15)
      pathlib.Path("days.txt").write_text(str(abs(delta.days)))
  - kind: exec
    command: "python _solve.py"
wrong:
  - kind: write_file
    path: /home/ubuntu/days.txt
    content: "75"
notes: 跨年且跨越 2 月，用来暴露"手工算天数"容易出的错。
