key: syn_prime_count
group: synthetic
title: 统计质数个数
goal: >-
  统计 1 到 1000 之间（含 1 和 1000）一共有多少个质数，
  把个数写入 /home/ubuntu/prime_count.txt，文件中只能有这一个数字。
tags: [numeric]
verify:
  - kind: numeric
    path: /home/ubuntu/prime_count.txt
    value: 168
    description: 1..1000 内质数个数
process:
  max_tool_calls: 15
  answer_literals: ["168"]
solution:
  - kind: write_file
    path: /home/ubuntu/_solve.py
    content: |
      import pathlib

      def is_prime(n):
          return n > 1 and all(n % d for d in range(2, int(n ** 0.5) + 1))

      count = sum(1 for n in range(1, 1001) if is_prime(n))
      pathlib.Path("prime_count.txt").write_text(str(count))
  - kind: exec
    command: "python _solve.py"
wrong:
  - kind: write_file
    path: /home/ubuntu/prime_count.txt
    content: "169"
