key: syn_word_freq
group: synthetic
# regression：⚠️ 原始历史是 5/10（看着像 50% 不稳定），但那 5 次失败**全是任务集期望值写错**
# （词频 Top3 算错），修正后 5/5 全对（docs/baseline-group-comparison.md §3.1）。
# 这条注释的作用是拦住后来者「看到 50% 就改标 capability」。
purpose: regression
title: 词频统计（输出 JSON）
goal: >-
  读取 /home/ubuntu/input/text.txt，统计其中每个英文单词出现的次数（忽略大小写，
  只按空格与换行分隔）。把所有单词按出现次数从高到低排序，
  取前 3 个写入 /home/ubuntu/top.json，格式为
  {"words": [{"word": "xxx", "count": 3}, ...]}，次数相同的按字典序排列。
tags: [text, json]
fixtures:
  - path: /home/ubuntu/input/text.txt
    content: |
      the quick brown fox jumps over the lazy dog
      The DOG barks and the fox runs
      a quick brown dog
verify:
  - kind: json_equals
    path: /home/ubuntu/top.json
    equals: '{"words": [{"word": "the", "count": 4}, {"word": "dog", "count": 3}, {"word": "brown", "count": 2}]}'
    description: 词频 Top3（the=4, dog=3, brown=2）
process:
  max_tool_calls: 15
solution:
  # 这个任务的期望值曾经写错（写成 the:3 / brown:2 / dog:2，正确是 the:4 / dog:3 / brown:2），
  # 而当时参考解是直接写出期望值，所以自检通过了 —— 现在改成真的算一遍。
  - kind: write_file
    path: /home/ubuntu/_solve.py
    content: |
      import collections
      import json
      import pathlib

      words = pathlib.Path("input/text.txt").read_text().lower().split()
      counter = collections.Counter(words)
      top = sorted(counter.items(), key=lambda kv: (-kv[1], kv[0]))[:3]
      payload = {"words": [{"word": w, "count": c} for w, c in top]}
      pathlib.Path("top.json").write_text(json.dumps(payload))
  - kind: exec
    command: "python _solve.py"
wrong:
  - kind: write_file
    path: /home/ubuntu/top.json
    content: '{"words": [{"word": "the", "count": 4}, {"word": "dog", "count": 3}, {"word": "brown", "count": 8}]}'
notes: >-
  错误解把 brown 的次数改成了 8 —— 用来确认判定器会比对具体的计数值，
  而不只是看词序对不对。

  这个任务曾经因为**期望值本身写错**而全部判失败（0/5）：
  正确值是 the=4 / dog=3 / brown=2，YAML 里写成了 the=3 / brown=2 / dog=2
  （把 the 少算了一行、dog 也少算了一次）。
  根因同上：参考解直接写出那个错的值，自检无法发现。
