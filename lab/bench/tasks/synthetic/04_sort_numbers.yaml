key: syn_sort_numbers
group: synthetic
# regression：traces.db 干净运行 10/10 全对（截至 2026-09-18）→ 稳定，可进回归门禁。
purpose: regression
title: 数字排序落盘
goal: >-
  读取 /home/ubuntu/input/numbers.txt（每行一个整数），按从小到大排序，
  把排序后的结果每行一个写入 /home/ubuntu/sorted.txt。
tags: [text, file-io]
fixtures:
  - path: /home/ubuntu/input/numbers.txt
    content: |
      42
      7
      -13
      256
      0
      99
      -1
      1024
      13
      7
verify:
  - kind: file_content
    path: /home/ubuntu/sorted.txt
    normalize: sorted_lines
    equals: |
      -13
      -1
      0
      7
      7
      13
      42
      99
      256
      1024
    description: 排序结果（含重复项）
process:
  max_tool_calls: 12
solution:
  # 参考解**真的算一遍**（而不是把期望值写出来），这样期望值写错时自检会失败。
  # 注意用 chr(10) 而不是 "\n"：跨 shell/YAML/JSON 多层转义时反斜杠极易被吃掉，
  # 作者就因为转义层问题踩过一次（\n 变成了真换行，YAML 直接解析失败）。
  - kind: write_file
    path: /home/ubuntu/_solve.py
    content: |
      import pathlib
      numbers = sorted(int(x) for x in pathlib.Path("input/numbers.txt").read_text().split())
      pathlib.Path("sorted.txt").write_text(chr(10).join(map(str, numbers)) + chr(10))
  - kind: exec
    command: "python _solve.py"
wrong:
  - kind: write_file
    path: /home/ubuntu/sorted.txt
    content: |
      -13
      -1
      0
      7
      13
      42
      99
      256
      1024
notes: 输入含重复值，去掉一个重复项就会失败 —— 这是"看起来对但实际漏数据"的检测点。
