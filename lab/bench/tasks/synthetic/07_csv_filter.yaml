key: syn_csv_filter
group: synthetic
# regression：traces.db 干净运行 14/14 全对（截至 2026-09-18）→ 稳定，可进回归门禁。
purpose: regression
title: CSV 条件筛选
goal: >-
  读取 /home/ubuntu/input/orders.csv（表头 id,item,amount），
  筛选出 amount 大于 100 的行（保留表头），写入 /home/ubuntu/filtered.csv。
tags: [csv]
fixtures:
  - path: /home/ubuntu/input/orders.csv
    content: |
      id,item,amount
      1,keyboard,89
      2,monitor,320
      3,mouse,25
      4,ssd,180
      5,desk,101
verify:
  - kind: csv_rows
    path: /home/ubuntu/filtered.csv
    rows:
      - ["id", "item", "amount"]
      - ["2", "monitor", "320"]
      - ["4", "ssd", "180"]
      - ["5", "desk", "101"]
    description: amount>100 的行（含表头）
process:
  max_tool_calls: 15
solution:
  # 参考解**真的算一遍**（而不是把期望行写出来），期望值写错时自检会失败。
  - kind: write_file
    path: /home/ubuntu/_solve.py
    content: |
      import csv
      import io
      import pathlib

      rows = list(csv.reader(io.StringIO(pathlib.Path("input/orders.csv").read_text())))
      keep = [rows[0]] + [r for r in rows[1:] if r and int(r[2]) > 100]
      buf = io.StringIO()
      csv.writer(buf).writerows(keep)
      pathlib.Path("filtered.csv").write_text(buf.getvalue())
  - kind: exec
    command: "python _solve.py"
wrong:
  - kind: write_file
    path: /home/ubuntu/filtered.csv
    content: |
      id,item,amount
      2,monitor,320
      4,ssd,180
notes: 边界值 101（略大于 100）必须留下；用 >= 或 > 的实现差别会在这里暴露。
