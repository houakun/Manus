key: ci_naive_datetime
group: ci
# capability：新任务类，方差未知（见 test_ci_tasks_are_capability_not_regression）。
purpose: capability
title: CI 归因：naive 与 aware 时间混比（TypeError）
tags: [ci-attribution, code-fix, datetime, exec]
goal: >-
  /home/ubuntu/ci_log.txt 是最近一次 CI 的失败输出。代码在 /home/ubuntu/repo/ 下，
  测试在 /home/ubuntu/repo/tests/ 下（**测试文件由 CI 提供，不得修改、不得删除**）。
  请定位失败的根本原因并修好代码，使 `python repo/tests/run_tests.py`
  （工作目录 /home/ubuntu）退出码为 0；然后把归因写入 /home/ubuntu/diagnosis.json，
  格式为 {"root_causes": [{"file": "...", "symbol": "...", "why": "..."}, ...]}，
  file 用相对 /home/ubuntu/repo/ 的路径，symbol 填出问题的函数名。
  注意：外部传入的截止时间是 **带时区** 的（UTC），而内部现在产出的是 naive 时间。
selfcheck:
  # 这份日志**必须**是真跑出来的：validate 会执行它并逐行比对（手编的会被抓住）。
  command: python repo/tests/run_tests.py
  expect_exit: 1
  output_recorded_in: /home/ubuntu/ci_log.txt
  # 这份日志是在 UTC+8 上捕获的：`test_naive_deadline_is_handled` 用本地时区算差值，
  # 在 UTC 上会 PASSED（差值恰好正确）。固定 TZ，让 Linux CI 也能逐行复现这份日志。
  timezone: Asia/Shanghai
fixtures:
  - path: /home/ubuntu/ci_log.txt
    content: |
      $ python tests/run_tests.py
      test_naive_deadline_is_handled ... FAILED
          expected True，actual False
      test_aware_deadline_is_handled ... ERROR TypeError: can't subtract offset-naive and offset-aware datetimes
      test_priority_with_aware_deadline ... ERROR TypeError: can't subtract offset-naive and offset-aware datetimes
      test_alerts_counts_aware_deadlines ... ERROR TypeError: can't subtract offset-naive and offset-aware datetimes
      ---------------------------------------------
      4 项：0 通过 / 4 失败
  - path: /home/ubuntu/repo/sla.py
    content: |
      """SLA 计算。"""
      from datetime import datetime


      def hours_left(deadline):
          """距离截止还有多少小时（deadline 是 **aware**，UTC）。"""
          # BUG: datetime.now() 是 naive，aware - naive 会抛
          # TypeError: can't subtract offset-naive and offset-aware datetimes。
          # 注意：传入 naive 截止时间的那条用例会"通过"（两个都 naive）。
          now = datetime.now()
          return (deadline - now).total_seconds() / 3600
  - path: /home/ubuntu/repo/tickets.py
    content: |
      """工单。"""
      from sla import hours_left


      def priority(deadline):
          """按剩余时间定优先级。"""
          return "urgent" if hours_left(deadline) < 24 else "normal"
  - path: /home/ubuntu/repo/alerts.py
    content: |
      """告警。"""
      from sla import hours_left


      def expiring(tickets):
          """统计即将到期的数量。"""
          return sum(1 for deadline in tickets if hours_left(deadline) < 24)
  - path: /home/ubuntu/repo/tests/run_tests.py
    content: |
      # CI-FROZEN: 本文件由 CI 提供，不得修改
      """最小的测试运行器（不依赖 pytest，只用标准库）。"""
      import pathlib
      import sys

      sys.path.insert(0, str(pathlib.Path(__file__).resolve().parent.parent))

      import alerts
      import sla
      import tickets
      from datetime import datetime, timedelta, timezone


      def test_naive_deadline_is_handled():
          actual = 47 <= sla.hours_left(datetime.now(timezone.utc).replace(tzinfo=None) + timedelta(hours=48)) <= 49
          return actual == True, actual, True

      def test_aware_deadline_is_handled():
          actual = 47 <= sla.hours_left(datetime.now(timezone.utc) + timedelta(hours=48)) <= 49
          return actual == True, actual, True

      def test_priority_with_aware_deadline():
          actual = tickets.priority(datetime.now(timezone.utc) + timedelta(hours=2)) == 'urgent'
          return actual == True, actual, True

      def test_alerts_counts_aware_deadlines():
          actual = alerts.expiring([datetime.now(timezone.utc) + timedelta(hours=1)]) == 1
          return actual == True, actual, True


      CASES = [
          ("test_naive_deadline_is_handled", test_naive_deadline_is_handled),
          ("test_aware_deadline_is_handled", test_aware_deadline_is_handled),
          ("test_priority_with_aware_deadline", test_priority_with_aware_deadline),
          ("test_alerts_counts_aware_deadlines", test_alerts_counts_aware_deadlines),
      ]


      def main():
          failed = 0
          for name, fn in CASES:
              try:
                  ok, actual, expected = fn()
              except Exception as exc:  # noqa: BLE001
                  print(f"{name} ... ERROR {type(exc).__name__}: {exc}")
                  failed += 1
                  continue
              if ok:
                  print(f"{name} ... PASSED")
              else:
                  print(f"{name} ... FAILED")
                  print(f"    expected {expected!r}，actual {actual!r}")
                  failed += 1
          print("-" * 45)
          print(f"{len(CASES)} 项：{len(CASES) - failed} 通过 / {failed} 失败")
          return 1 if failed else 0


      if __name__ == "__main__":
          sys.exit(main())
verify:
  # 执行型检查（最强）：脚本来自**任务定义**（不在工作区），Agent 改不了断言，
  # 而且它真的跑一遍修完的代码 —— 症状级修复会在这里挂掉。
  - kind: exec_script
    script_cwd: /home/ubuntu/repo
    description: naive 与 aware 时间混比（TypeError）
    script: |
      from datetime import datetime, timedelta, timezone

      from alerts import expiring
      from sla import hours_left
      from tickets import priority

      problems = []
      for label, deadline in (("naive", datetime.now(timezone.utc).replace(tzinfo=None) + timedelta(hours=48)),
                              ("aware", datetime.now(timezone.utc) + timedelta(hours=48))):
          try:
              value = hours_left(deadline)
          except Exception as exc:  # noqa: BLE001
              problems.append(f"hours_left({label}) 抛 {type(exc).__name__}")
              continue
          if not 47 <= value <= 49:
              problems.append(f"hours_left({label})={value!r}")
      if priority(datetime.now(timezone.utc) + timedelta(hours=2)) != "urgent":
          problems.append("priority(aware +2h) 不是 urgent")
      if expiring([datetime.now(timezone.utc) + timedelta(hours=1)]) != 1:
          problems.append("expiring 计数错误")
      if problems:
          print("FAIL:", problems)
          raise SystemExit(1)
      print("OK: naive/aware 都能算出剩余小时，两个调用方都正确")
  - kind: file_content
    path: /home/ubuntu/repo/tests/run_tests.py
    contains: "# CI-FROZEN"
    description: CI 提供的测试运行器未被删除或整体覆盖
  - kind: file_content
    path: /home/ubuntu/diagnosis.json
    contains: "sla.py"
    description: 归因里点名了真正有 bug 的模块
  - kind: file_content
    path: /home/ubuntu/diagnosis.json
    contains: "hours_left"
    description: 归因里点名了出问题的符号
process:
  max_tool_calls: 40
solution:
  - kind: write_file
    path: /home/ubuntu/repo/sla.py
    content: |
      """SLA 计算。"""
      from datetime import datetime, timezone


      def _as_aware(moment):
          """统一成 aware（UTC）：naive 一律按 UTC 解释。"""
          if moment.tzinfo is None:
              return moment.replace(tzinfo=timezone.utc)
          return moment


      def hours_left(deadline):
          """距离截止还有多少小时。"""
          # 两边都归一到 aware 再相减：naive 与 aware 混比会直接抛异常
          return (_as_aware(deadline) - datetime.now(timezone.utc)).total_seconds() / 3600
  - kind: write_file
    path: /home/ubuntu/diagnosis.json
    content: |
      {"root_causes": [{"file": "sla.py", "symbol": "hours_left", "why": "naive datetime 与 aware datetime 相减直接抛 TypeError；应当统一到同一时区再比较"}]}
wrong:
  # 症状级错解：只在**调用点**打补丁，共享模块仍然是坏的 —— 必须被拒绝。
  - kind: write_file
    path: /home/ubuntu/repo/tickets.py
    content: |
      """工单。"""
      from sla import hours_left


      def priority(deadline):
          """按剩余时间定优先级。"""
          # 症状级修复：在这里给 deadline 去掉时区（只在调用点绕过），
          # 共享的 hours_left 仍然会在别的调用方炸
          return "urgent" if hours_left(deadline.replace(tzinfo=None)) < 24 else "normal"
  - kind: write_file
    path: /home/ubuntu/diagnosis.json
    content: |
      {"root_causes": [{"file": "tickets.py", "symbol": "?", "why": "只在调用点补回来的症状级修复"}]}
notes: >-
  **自动生成**（`lab/bench/tasks/ci/_capture_logs.py`）：`ci_log.txt` 是真跑 buggy 代码捕获的输出，所以 `selfcheck` 的真实性规则必然通过；手编日志会被 validate 抓住。
  设计要点：同一处共享模块被**两个调用方**使用（alerts.py、sla.py、tickets.py），
  所以只在调用点打补丁的"症状级修复"会在另一个调用方上暴露；
  另外还有一条日志里**没有**的边界用例（expiring([aware +1h]) 必须能算）挡住过拟合。
