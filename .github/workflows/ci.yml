name: lab

# 这个 workflow **不花钱**：只跑单元测试与任务集自检，不调用任何模型。
# 花钱的评测（bench run）永远不进 CI —— 它应该由人显式触发。
on:
  push:
    paths:
      - "lab/**"
      - "api/app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "lab/**"
      - "api/app/**"
  workflow_dispatch: # 允许手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 依赖清单抽到 lab/requirements.txt：**本地与 CI 用同一份**，
      # 避免"CI 里能过、本地装不上"（或反过来）的漂移。
      # 刻意不含 SUT 的运行期依赖（playwright / docker / alembic / cos-sdk）：
      # lab 的测试只需要 SUT 的**纯 Python 部分能 import**，装全量会让 CI 慢十倍。
      - name: Install lab dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lab/requirements.txt

      # lint：与单测同源的真问题（未用导入 / 未定义名 / 语法问题 / 刻意 E402）。
      # 曾经没有这一步，于是"刻意忽略"只能靠 `# noqa` 注释维持，
      # 而那批注释被一次过宽的 `--fix` 删掉 109 处、没人发现（ruff.toml 有完整记录）。
      # 现在规则集与 ruff 版本都钉在 ruff.toml / lab/requirements.txt 里。
      - name: Lint (ruff)
        run: python -m ruff check lab/

      # 全量单测：覆盖中间件 / 判定器 / 统计 / 任务集 / CLI / SUT 健壮性
      #              + 录制回放（含"不联网"与"成本口径"两个铁约束）
      #              + 交错 A/B 排程 / 噪声地板 / 实验条件落库
      - name: Unit tests
        run: |
          set +e
          python -m pytest -q --tb=short > pytest.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # 把失败摘要写进 **step summary**：run 页面直接可见，
            # 不需要登录下载日志（维护者与外部贡献者都能看到为什么红）。
            # 背景：之前 CI 长期红，但失败信息只在需要认证的日志里，
            # 导致“本地绿灯、CI 红灯”排查变成猜谜。
            {
              echo "## pytest 失败（摘要）"
              echo '```text'
              tail -60 pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat pytest.log
          fi
          exit $code

      # 任务集三步自检 + 同义反复检测。
      # 这一步是"评测台自身可信度"的门禁：
      # 期望值写错、判定器太松/太严、参考解直接写出答案，都会在这里暴露。
      - name: Task set self-check (no API key needed)
        run: python -m lab bench validate

      # CLI 的可发现性：至少保证 --help 不会崩。
      # 这里刻意不跑 `replay stats` —— 干净的 CI 环境里没有缓存库，
      # 它会退 2。那对它自己是"正确行为"，但会把 CI 弄红，所以只测 --help。
      - name: CLI smoke
        run: |
          python -m lab --help
          python -m lab bench --help
          python -m lab bench noise-floor --help
          python -m lab bench gate --help
          python -m lab replay --help
          python -m lab sandbox clean-escapes
